# tsagent Helm chart — every knob in one place.
#
# Nothing environment-specific is hard-coded in the application: it all arrives through the
# ConfigMaps and Secret this chart renders.
#
#   helm upgrade --install tsagent deploy/helm/tsagent -n tsagent --create-namespace \
#     -f deploy/helm/tsagent/values-openshift-prod.yaml -f my-site.yaml
#
# Layering, lowest to highest precedence:
#   1. files/config/*.yaml  — copies of the repo's config/ (scripts/sync-chart-config.sh)
#   2. settings / llm / clusters below
#   3. env: (TSAGENT_* env vars, e.g. TSAGENT_CORRELATION__WINDOW_SECONDS)
# And inside any config string: ${ENV_VAR} / ${ENV_VAR:-default}, resolved in the pod.

nameOverride: ""
fullnameOverride: ""
# Added to every object the chart creates.
commonLabels: {}
commonAnnotations: {}

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  # Internal registry by default (what build.enabled produces). For an external registry set
  # e.g. quay.io/acme/tsagent.
  repository: image-registry.openshift-image-registry.svc:5000/tsagent/tsagent
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # sha256:... — pins the image, wins over tag
  pullPolicy: IfNotPresent
imagePullSecrets: []
# - name: quay-pull-secret

# ---------------------------------------------------------------------------
# In-cluster build (OpenShift BuildConfig + ImageStream)
# ---------------------------------------------------------------------------
build:
  enabled: false
  # Where the source comes from. For a private repo create a source secret:
  #   oc create secret generic git-creds --type=kubernetes.io/basic-auth \
  #     --from-literal=username=<user> --from-literal=password=<token>
  git:
    uri: https://github.com/terra-bacth/alertsummary.git
    ref: master
    contextDir: ""
    sourceSecret: ""
  dockerfilePath: Dockerfile
  # Build args (see the Dockerfile) — point at mirrors for a disconnected cluster.
  args: {}
  #   PYTHON_IMAGE: mirror.example.com/ubi9/python-311:latest
  #   NODE_IMAGE: mirror.example.com/ubi9/nodejs-20:latest
  #   PIP_INDEX_URL: https://nexus.example.com/repository/pypi/simple
  #   NPM_REGISTRY: https://nexus.example.com/repository/npm/
  # Build-time env, e.g. HTTP(S)_PROXY for the build pod.
  env: []
  # Rebuild when the BuildConfig changes. Add a GitHub/Generic webhook with `triggers.webhooks`.
  triggers:
    configChange: true
    webhooks: []
    # - type: GitHub
    #   secretName: tsagent-github-webhook
  resources: {}
  runPolicy: Serial
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  nodeSelector: {}
  # Roll the Deployment automatically when a new image lands in the ImageStream.
  autoDeploy: true
  # ImageStream tag the build pushes and the Deployment runs.
  outputTag: latest

# ---------------------------------------------------------------------------
# Workload
# ---------------------------------------------------------------------------
# One replica only. The case store and LangGraph checkpointer are SQLite on a RWO volume and the
# SSE event bus is in-process, so a second replica would fail to mount or split state. The
# template refuses anything else.
replicaCount: 1
revisionHistoryLimit: 5

containerPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Must exceed env.TSAGENT_TIMEOUT_GRACEFUL_SHUTDOWN + settings.orchestrator.shutdown_grace_seconds.
terminationGracePeriodSeconds: 60

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# Startup can take a while: incidents left unfinished by the previous pod are resumed first.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 36  # 3 minutes

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# Directors are often not in cluster DNS; pin them here rather than editing clusters.yaml to IPs.
hostAliases: []
# - ip: 10.0.0.10
#   hostnames: [ospdirector.rhosp2.caas.com]
dnsPolicy: ""
dnsConfig: {}
lifecycle: {}
extraInitContainers: []
sidecars: []
extraVolumes: []
extraVolumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The token is needed when Prometheus is reached with the pod's own identity
  # (bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token).
  automountServiceAccountToken: true

# Lets the service account query Prometheus (e.g. STF, or the platform Thanos querier) using
# bearer_token_file. Binds a ClusterRole such as cluster-monitoring-view.
rbac:
  prometheusReader:
    enabled: false
    clusterRole: cluster-monitoring-view
    # Namespaced alternative: bind `role` in `namespace` instead of the ClusterRole.
    namespace: ""
    role: ""

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  existingClaim: ""
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  annotations: {}
  # Keep the PVC (and the case history) when the release is uninstalled.
  keep: true

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  annotations: {}

route:
  enabled: true
  host: ""  # empty: <name>-<namespace>.<apps domain>
  path: ""
  # Expose under a path prefix? Set path AND env.TSAGENT_ROOT_PATH to the same value.
  annotations:
    # The dashboard holds a Server-Sent Events connection open; the router's default 30s
    # server timeout would cut it. The UI reconnects anyway, this just avoids the churn.
    haproxy.router.openshift.io/timeout: 1h
    # Restrict who can reach the Route, e.g. "10.0.0.0/8 192.168.0.0/16".
    # haproxy.router.openshift.io/ip_whitelist: ""
  labels: {}
  # Route shard selection, e.g. {type: internal}.
  tls:
    termination: edge  # edge | reencrypt | passthrough; reencrypt is automatic with tls.serviceServingCert
    insecureEdgeTerminationPolicy: Redirect
    # certificate / key / caCertificate / destinationCACertificate may be set here too.
  wildcardPolicy: None

# End-to-end TLS inside the cluster: OpenShift's service CA issues a certificate for the Service,
# the app serves HTTPS with it and the Route switches to reencrypt.
tls:
  serviceServingCert:
    enabled: false

networkPolicy:
  enabled: true
  # Which namespaces may reach port 8080 (AlertManager posting /alerts, Prometheus scraping).
  # The OpenShift router is always allowed so the Route works.
  ingressFromNamespaces:
    - openshift-monitoring
    - openshift-user-workload-monitoring
  # Also allow pods in the release namespace (e.g. an in-namespace AlertManager).
  allowSameNamespace: false
  allowDNS: true
  # Egress is denied except for these. Ports reflect config/: HTTPS Routes for Prometheus and
  # LLMs (443/80), in-cluster Prometheus (9090), director SSH (22), vLLM (8000), Ollama (11434).
  # Add `to:` (standard NetworkPolicy peers) to a rule to narrow it to specific CIDRs/namespaces.
  allowedEgress:
    - description: Prometheus (in-cluster service / STF route)
      ports: [9090, 443]
    - description: director SSH
      ports: [22]
    - description: LLM endpoints (vLLM / Ollama / OpenShift AI routes)
      ports: [80, 443, 8000, 11434]
  # Any further raw egress rules.
  extraEgress: []
  extraIngress: []

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  # Defaults to https when tls.serviceServingCert is enabled.
  scheme: ""
  tlsConfig: {}

# ---------------------------------------------------------------------------
# Outbound proxy and CA trust
# ---------------------------------------------------------------------------
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ".svc,.cluster.local,localhost,127.0.0.1"

# Mount the cluster-wide trusted CA bundle (proxy/corporate CAs) that OpenShift injects into a
# labelled ConfigMap, and make Python/httpx/LiteLLM trust it.
trustedCABundle:
  enabled: false

# ---------------------------------------------------------------------------
# Process environment (rendered into the <name>-env ConfigMap)
# ---------------------------------------------------------------------------
# Any TSAGENT_* variable works here, including nested settings.yaml overrides such as
# TSAGENT_REFLECTION__ENABLED=false. Paths, port and TLS are managed by the chart.
env:
  TSAGENT_LOG_LEVEL: INFO
  TSAGENT_LOG_FORMAT: text  # json for OpenShift Logging / Loki
  TSAGENT_ACCESS_LOG: "true"
  TSAGENT_HOST: "::"  # use 0.0.0.0 on clusters without IPv6 in the pod network
  TSAGENT_CORS_ORIGINS: "*"
  TSAGENT_METRICS_ENABLED: "true"
  TSAGENT_TIMEOUT_KEEP_ALIVE: "5"
  TSAGENT_TIMEOUT_GRACEFUL_SHUTDOWN: "20"
  TSAGENT_FORWARDED_ALLOW_IPS: "*"
  TSAGENT_ROOT_PATH: ""
  # Serve the dashboard from the API pod (same Route, no CORS). "" disables it.
  TSAGENT_UI_DIR: /opt/app-root/src/web/dist
  # TSAGENT_LLM_PROFILE: anthropic      # override llm.default_profile
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  LITELLM_TELEMETRY: "False"

# Plain env entries (valueFrom etc.) and whole ConfigMaps/Secrets as env.
extraEnv: []
extraEnvFrom: []
# - secretRef:
#     name: llm-api-keys

# ---------------------------------------------------------------------------
# Application config (rendered into the <name>-config ConfigMap)
# ---------------------------------------------------------------------------
config:
  # Use a ConfigMap you manage yourself (keys settings.yaml, llm.yaml, clusters.yaml) instead.
  existingConfigMap: ""

# Deep-merged over files/config/settings.yaml: set only what differs.
settings: {}
#  correlation:
#    window_seconds: 300
#  demo:
#    enabled: false
#  ssh:
#    command_timeout_seconds: 180

# LLM profiles. Empty uses files/config/llm.yaml as-is; non-empty REPLACES it (a partial merge
# would keep the other file's profiles and endpoints around). See values-*.yaml presets.
llm: {}

# Cluster inventory. Empty uses files/config/clusters.yaml; non-empty REPLACES it — merging
# would leave the lab cluster in a production inventory. Strings may use ${ENV}, e.g.
#   url: "${PROMETHEUS_URL}"   with   env: {PROMETHEUS_URL: https://...}
clusters: {}

# SSH command allow-list — the security boundary for node access.
allowlist:
  existingConfigMap: ""
  # Replaces files/ssh_allowlist.yaml when set (full YAML document as a string).
  content: ""

runbooks:
  existingConfigMap: ""
  # Added next to files/runbooks/*.yaml. filename -> YAML string.
  extra: {}

knowledge:
  existingConfigMap: ""
  # Replaces files/promql_library.yaml when set.
  promqlLibrary: ""
  # Metric catalogues, <cluster-key>.txt -> newline-separated metric names.
  metrics: {}

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
# Preferred: create the Secret out of band and set existingSecret, e.g.
#   oc create secret generic tsagent-secrets \
#     --from-file=sshPrivateKey=$HOME/.ssh/tsagent_ed25519 \
#     --from-file=sshKnownHosts=./known_hosts \
#     --from-literal=TSAGENT_DIRECTOR_PASSWORD=... \
#     --from-literal=TSAGENT_PROM_TOKEN=...
secrets:
  existingSecret: ""
  # Only used when the chart creates the Secret. Avoid committing real values.
  sshPrivateKey: ""
  sshKnownHosts: ""
  # Set true when existingSecret carries an sshKnownHosts key: turns on host-key verification.
  # (Automatically true when sshKnownHosts is given above.)
  verifyHostKeys: false
  # NAME -> value. Every key becomes an env var of the same name, read from the Secret. With an
  # existingSecret, list the keys with empty values — only the names are used.
  env:
    TSAGENT_DIRECTOR_PASSWORD: ""   # director.password_env in clusters.yaml
    TSAGENT_PROM_TOKEN: ""          # prometheus bearer_token_env
  # Kept for backwards compatibility; merged into env.
  apiKeys: {}

# `helm test` pod that checks /readyz through the Service.
tests:
  enabled: true
