# Lab default: Llama 3.2 8B + Qwen on CPU-only vLLM in the cluster.
#
#   helm upgrade --install tsagent deploy/helm/tsagent -f deploy/helm/tsagent/values-vllm.yaml
#
# CPU inference is slow, so the timeouts are long and the reflection budget is small. If an
# incident takes too many minutes end to end, turn reflection off before touching anything else.
llm:
  default_profile: llama-lab
  defaults:
    timeout_seconds: 300
    max_tokens: 1024
    temperature: 0.1
    max_attempts: 3
    retry_backoff_seconds: 2
  profiles:
    llama-lab:
      model: hosted_vllm/meta-llama/Llama-3.2-8B-Instruct
      api_base: http://vllm-llama.llm-serving.svc:8000/v1
      api_key_env: TSAGENT_VLLM_API_KEY
      structured_output: prompt
    qwen-lab:
      model: hosted_vllm/Qwen/Qwen2.5-7B-Instruct
      api_base: http://vllm-qwen.llm-serving.svc:8000/v1
      api_key_env: TSAGENT_VLLM_API_KEY
      structured_output: prompt
  per_agent_overrides:
    planner: qwen-lab
    promql: qwen-lab
    reflection: llama-lab
  fallback_chain: []

settings:
  reflection:
    enabled: true
    max_retries: 2
  investigation:
    max_promql_queries: 5
    max_node_commands: 6

networkPolicy:
  allowedEgress:
    - description: Prometheus
      ports: [9090]
    - description: director SSH
      ports: [22]
    - description: vLLM
      ports: [8000]
