{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tsagent.fullname" . }}-test
  # Deliberately NOT the selector labels, so the Service never routes to this pod.
  labels:
    app.kubernetes.io/name: {{ include "tsagent.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readyz
      # The app image already has Python; no extra image to mirror for disconnected clusters.
      image: {{ include "tsagent.image" . | quote }}
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      command:
        - python
        - -c
        - |
          import ssl, sys, urllib.request
          url = "{{ include "tsagent.httpScheme" . | lower }}://{{ include "tsagent.fullname" . }}:{{ .Values.service.port }}/readyz"
          ctx = ssl._create_unverified_context()
          body = urllib.request.urlopen(url, timeout=10, context=ctx).read().decode()
          print(url, "->", body)
          sys.exit(0 if "ready" in body else 1)
{{- end }}
