{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tsagent.serviceAccountName" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" . "extra" .Values.serviceAccount.annotations) }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- with .Values.rbac.prometheusReader }}
{{- if .enabled }}
---
{{- if and .namespace .role }}
# Read access to Prometheus in {{ .namespace }} only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tsagent.fullname" $ }}-prometheus-reader
  namespace: {{ .namespace }}
  labels:
    {{- include "tsagent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .role }}
{{- else }}
# Lets the pod's service-account token query Prometheus / Thanos (bearer_token_file).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tsagent.fullname" $ }}-{{ $.Release.Namespace }}-prometheus-reader
  labels:
    {{- include "tsagent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .clusterRole }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tsagent.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
