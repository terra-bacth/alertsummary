{{- $annotations := deepCopy (.Values.service.annotations | default dict) }}
{{- if .Values.tls.serviceServingCert.enabled }}
{{- /* OpenShift's service CA issues tls.crt/tls.key for <svc>.<ns>.svc into this Secret. */}}
{{- $_ := set $annotations "service.beta.openshift.io/serving-cert-secret-name" (printf "%s-tls" (include "tsagent.fullname" .)) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tsagent.fullname" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" . "extra" $annotations) }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tsagent.selectorLabels" . | nindent 4 }}
