{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
# Scraped by OpenShift user-workload monitoring once it is enabled on the cluster
# (cluster-monitoring-config: enableUserWorkload: true).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tsagent.fullname" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- include "tsagent.annotations" (dict "root" .) }}
spec:
  selector:
    matchLabels:
      {{- include "tsagent.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: {{ default (include "tsagent.httpScheme" . | lower) .Values.serviceMonitor.scheme }}
      {{- if .Values.serviceMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml .Values.serviceMonitor.tlsConfig | nindent 8 }}
      {{- else if .Values.tls.serviceServingCert.enabled }}
      tlsConfig:
        serverName: {{ include "tsagent.fullname" . }}.{{ .Release.Namespace }}.svc
        ca:
          configMap:
            name: {{ include "tsagent.fullname" . }}-service-ca
            key: service-ca.crt
      {{- end }}
{{- end }}
{{- if and .Values.serviceMonitor.enabled .Values.tls.serviceServingCert.enabled (not .Values.serviceMonitor.tlsConfig) }}
---
# Filled by OpenShift's service CA operator; lets Prometheus verify the pod's certificate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tsagent.fullname" . }}-service-ca
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
{{- end }}
