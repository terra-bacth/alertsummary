{{- if .Values.route.enabled }}
{{- $tls := deepCopy (.Values.route.tls | default dict) }}
{{- if and .Values.tls.serviceServingCert.enabled $tls (ne (get $tls "termination") "passthrough") }}
{{- /* The pod serves HTTPS with a service-CA certificate, which the router already trusts. */}}
{{- $_ := set $tls "termination" "reencrypt" }}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "tsagent.fullname" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
    {{- with .Values.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- include "tsagent.annotations" (dict "root" . "extra" .Values.route.annotations) }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  {{- with .Values.route.path }}
  path: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "tsagent.fullname" . }}
    weight: 100
  port:
    targetPort: http
  {{- with $tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  wildcardPolicy: {{ .Values.route.wildcardPolicy }}
{{- end }}
