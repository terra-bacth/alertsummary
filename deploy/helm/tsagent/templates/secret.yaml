{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tsagent.secretName" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" .) }}
type: Opaque
stringData:
  {{- if .Values.secrets.sshPrivateKey }}
  sshPrivateKey: |
    {{- .Values.secrets.sshPrivateKey | trim | nindent 4 }}
  {{- end }}
  {{- if .Values.secrets.sshKnownHosts }}
  sshKnownHosts: |
    {{- .Values.secrets.sshKnownHosts | trim | nindent 4 }}
  {{- end }}
  {{- /* Empty values are left out, so the matching env var stays unset rather than "" — an
  empty string would otherwise shadow the same name supplied through extraEnvFrom. */}}
  {{- range $key, $value := (include "tsagent.secretEnv" . | fromYaml) }}
  {{- if $value }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
