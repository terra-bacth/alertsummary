{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tsagent.fullname" . }}-secrets
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.sshPrivateKey }}
  sshPrivateKey: |
{{ .Values.secrets.sshPrivateKey | indent 4 }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.apiKeys }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
