{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{- $annotations := deepCopy (.Values.persistence.annotations | default dict) }}
{{- if .Values.persistence.keep }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tsagent.fullname" . }}-data
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" . "extra" $annotations) }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
