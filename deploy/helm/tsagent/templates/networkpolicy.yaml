{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Default-deny with explicit holes. The agent holds SSH credentials to every director in the
# estate, so its egress surface is worth constraining tightly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tsagent.fullname" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" .) }}
spec:
  podSelector:
    matchLabels:
      {{- include "tsagent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # AlertManager posting /alerts, Prometheus scraping /metrics, and the router for the Route.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        {{- $namespaces := $np.ingressFromNamespaces | default list }}
        {{- with $np.ingressFromNamespace }}
        {{- $namespaces = append $namespaces . }}
        {{- end }}
        {{- range $namespaces | uniq }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- if $np.allowSameNamespace }}
        - podSelector: {}
        {{- else if .Values.tests.enabled }}
        # The `helm test` pod.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: helm-test
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if $np.allowDNS }}
    # Cluster DNS (OpenShift's resolvers listen on 5353 behind the 53 service port).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    {{- end }}
    {{- range $np.allowedEgress }}
    # {{ .description }}
    - ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with .to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
