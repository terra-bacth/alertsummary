{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tsagent.configMapName" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" .) }}
data:
  settings.yaml: |
    {{- include "tsagent.settingsYaml" . | nindent 4 }}
  llm.yaml: |
    {{- include "tsagent.llmYaml" . | nindent 4 }}
  clusters.yaml: |
    {{- include "tsagent.clustersYaml" . | nindent 4 }}
{{- end }}
{{- if not .Values.allowlist.existingConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tsagent.allowlistConfigMapName" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" .) }}
data:
  # Kept in its own ConfigMap: this is the security boundary for node access, and it should be
  # reviewable and changeable independently of routine tuning.
  ssh_allowlist.yaml: |
    {{- default (.Files.Get "files/ssh_allowlist.yaml") .Values.allowlist.content | nindent 4 }}
{{- end }}
{{- if not .Values.runbooks.existingConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tsagent.runbooksConfigMapName" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" .) }}
data:
  {{- range $path, $_ := .Files.Glob "files/runbooks/*.yaml" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- range $name, $content := .Values.runbooks.extra }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
{{- if not .Values.knowledge.existingConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tsagent.knowledgeConfigMapName" . }}
  labels:
    {{- include "tsagent.labels" . | nindent 4 }}
  {{- include "tsagent.annotations" (dict "root" .) }}
data:
  # Known-good PromQL shown to the agent as worked examples.
  promql_library.yaml: |
    {{- default (.Files.Get "files/promql_library.yaml") .Values.knowledge.promqlLibrary | nindent 4 }}
  {{- /* Metric catalogues: a generated query naming anything outside the list is not executed. */}}
  {{- range $path, $_ := .Files.Glob "files/metrics/*.txt" }}
  {{- if not (hasKey $.Values.knowledge.metrics (base $path)) }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- range $name, $content := .Values.knowledge.metrics }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
