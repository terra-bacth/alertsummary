# Helm-less deployment. ConfigMaps are generated straight from the repo's config/ directory, so
# there is no second copy to drift; the hash suffix Kustomize appends makes every config change
# roll the pod automatically.
#
# config/ lives outside this directory, hence the load restrictor flag:
#   oc kustomize --load-restrictor LoadRestrictionsNone deploy/openshift/overlays/lab | oc apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: tsagent
      app.kubernetes.io/instance: tsagent
    includeSelectors: true
  - pairs:
      app.kubernetes.io/part-of: tsagent
      app.kubernetes.io/version: "0.1.0"

resources:
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

images:
  - name: tsagent
    newName: image-registry.openshift-image-registry.svc:5000/tsagent/tsagent
    newTag: "0.1.0"

configMapGenerator:
  # Process settings (TSAGENT_* env vars) — edit env.properties or override in an overlay.
  - name: tsagent-env
    envs:
      - env.properties
  - name: tsagent-config
    files:
      - ../../../config/settings.yaml
      - ../../../config/llm.yaml
      - ../../../config/clusters.yaml
  # The security boundary for node access, reviewable on its own.
  - name: tsagent-allowlist
    files:
      - ../../../config/ssh_allowlist.yaml
  - name: tsagent-runbooks
    files:
      - ../../../config/runbooks/rhosp.yaml
      - ../../../config/runbooks/stf.yaml
  # Add metric catalogues here as config/metrics/<cluster-key>.txt, e.g.
  #   - ../../../config/metrics/lab-cluster-1.txt
  - name: tsagent-knowledge
    files:
      - ../../../config/promql_library.yaml
