# Process settings for the tsagent container (rendered into the tsagent-env ConfigMap).
# Any TSAGENT_* variable works, including settings.yaml overrides such as
# TSAGENT_CORRELATION__WINDOW_SECONDS=60 or TSAGENT_DEMO__ENABLED=false.
TSAGENT_LOG_LEVEL=INFO
TSAGENT_LOG_FORMAT=text
TSAGENT_ACCESS_LOG=true
TSAGENT_HOST=::
TSAGENT_CORS_ORIGINS=*
TSAGENT_METRICS_ENABLED=true
TSAGENT_TIMEOUT_KEEP_ALIVE=5
TSAGENT_TIMEOUT_GRACEFUL_SHUTDOWN=20
TSAGENT_FORWARDED_ALLOW_IPS=*
TSAGENT_UI_DIR=/opt/app-root/src/web/dist
LITELLM_LOCAL_MODEL_COST_MAP=True
LITELLM_TELEMETRY=False
