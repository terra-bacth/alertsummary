# Default-deny with explicit holes. The agent holds SSH credentials to every director in the
# estate, so its egress surface is worth constraining tightly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tsagent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tsagent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
    # Prometheus (service / STF route)
    - ports:
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 443}
    # director SSH
    - ports:
        - {protocol: TCP, port: 22}
    # LLM endpoints (vLLM / Ollama / routes)
    - ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 11434}
