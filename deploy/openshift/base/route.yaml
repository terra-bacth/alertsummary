apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tsagent
  annotations:
    # Keeps the dashboard's Server-Sent Events connection from being cut every 30s.
    haproxy.router.openshift.io/timeout: 1h
spec:
  to:
    kind: Service
    name: tsagent
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
