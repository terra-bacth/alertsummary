# Trust the cluster-wide CA bundle (corporate proxy / internal CAs) for Prometheus, LLM endpoints
# and webhooks. The Cluster Network Operator fills the ConfigMap.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - trusted-ca.yaml

patches:
  - target:
      kind: Deployment
      name: tsagent
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: trusted-ca
          configMap:
            name: tsagent-trusted-ca
            items:
              - key: ca-bundle.crt
                path: tls-ca-bundle.pem
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: trusted-ca
          mountPath: /etc/pki/ca-trust/extracted/pem
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: SSL_CERT_FILE, value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: REQUESTS_CA_BUNDLE, value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem}
