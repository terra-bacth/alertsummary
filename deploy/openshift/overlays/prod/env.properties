# Production overrides of base/env.properties.
TSAGENT_LOG_FORMAT=json
TSAGENT_ACCESS_LOG=false
# Never mix scripted demo incidents into the production case store.
TSAGENT_DEMO__ENABLED=false
TSAGENT_CORRELATION__WINDOW_SECONDS=300
TSAGENT_ORCHESTRATOR__SHUTDOWN_GRACE_SECONDS=20
# Requires an sshKnownHosts key in the tsagent-ssh Secret.
TSAGENT_SSH__KNOWN_HOSTS=/etc/tsagent/ssh/known_hosts
