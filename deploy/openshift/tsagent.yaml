# Raw manifests for clusters where Helm is not available.
#
#   oc new-project tsagent
#   oc create secret generic tsagent-secrets \
#       --from-file=sshPrivateKey=/path/to/id_ed25519
#   oc create configmap tsagent-allowlist --from-file=../../config/ssh_allowlist.yaml
#   oc create configmap tsagent-runbooks --from-file=../../config/runbooks/
#   oc apply -f tsagent.yaml
#
# Edit the ConfigMap below for your Prometheus URL and director host before applying.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsagent-config
  labels:
    app.kubernetes.io/name: tsagent
data:
  settings.yaml: |
    correlation:
      window_seconds: 300
      max_group_age_seconds: 900
      sweep_interval_seconds: 15
    reflection:
      enabled: true
      max_retries: 2
    investigation:
      max_promql_queries: 6
      max_node_commands: 8
      node_access_threshold: 0.7
    report:
      notify_webhook: ""
  llm.yaml: |
    default_profile: llama-lab
    defaults:
      timeout_seconds: 300
      max_tokens: 1024
      temperature: 0.1
      max_attempts: 3
      retry_backoff_seconds: 2
    profiles:
      llama-lab:
        model: hosted_vllm/meta-llama/Llama-3.2-8B-Instruct
        api_base: http://vllm-llama.llm-serving.svc:8000/v1
        api_key_env: TSAGENT_VLLM_API_KEY
      qwen-lab:
        model: hosted_vllm/Qwen/Qwen2.5-7B-Instruct
        api_base: http://vllm-qwen.llm-serving.svc:8000/v1
        api_key_env: TSAGENT_VLLM_API_KEY
    per_agent_overrides:
      planner: qwen-lab
      promql: qwen-lab
      reflection: llama-lab
    fallback_chain: []
  clusters.yaml: |
    prometheus_instances:
      prom-lab:
        url: http://prometheus.lab.example:9090
        timeout_seconds: 30
    clusters:
      lab-cluster-1:
        prometheus: prom-lab
        director:
          host: director.lab.example
          user: troubleshoot
          auth: key
          key_path: /etc/tsagent/ssh/id_ed25519
        labels:
          site: lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tsagent-data
  labels:
    app.kubernetes.io/name: tsagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsagent
  labels:
    app.kubernetes.io/name: tsagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tsagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tsagent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tsagent
          image: image-registry.openshift-image-registry.svc:5000/tsagent/tsagent:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TSAGENT_CONFIG_DIR
              value: /etc/tsagent/config
            - name: TSAGENT_DB_PATH
              value: /opt/app-root/data/cases.db
            - name: TSAGENT_CHECKPOINT_PATH
              value: /opt/app-root/data/checkpoints.db
          volumeMounts:
            - name: config
              mountPath: /etc/tsagent/config
              readOnly: true
            - name: allowlist
              mountPath: /etc/tsagent/config/ssh_allowlist.yaml
              subPath: ssh_allowlist.yaml
              readOnly: true
            - name: runbooks
              mountPath: /etc/tsagent/config/runbooks
              readOnly: true
            - name: ssh-key
              mountPath: /etc/tsagent/ssh
              readOnly: true
            - name: data
              mountPath: /opt/app-root/data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: tsagent-config
        - name: allowlist
          configMap:
            name: tsagent-allowlist
        - name: runbooks
          configMap:
            name: tsagent-runbooks
        - name: ssh-key
          secret:
            secretName: tsagent-secrets
            optional: true
            items:
              - key: sshPrivateKey
                path: id_ed25519
                mode: 0400
        - name: data
          persistentVolumeClaim:
            claimName: tsagent-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tsagent
  labels:
    app.kubernetes.io/name: tsagent
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: tsagent
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tsagent
  labels:
    app.kubernetes.io/name: tsagent
spec:
  to:
    kind: Service
    name: tsagent
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tsagent
  labels:
    app.kubernetes.io/name: tsagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tsagent
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tsagent
  labels:
    app.kubernetes.io/name: tsagent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tsagent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Prometheus
    - ports:
        - protocol: TCP
          port: 9090
    # director SSH
    - ports:
        - protocol: TCP
          port: 22
    # vLLM / Ollama
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 11434
