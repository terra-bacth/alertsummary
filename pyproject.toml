[project]
name = "tsagent"
version = "0.1.0"
description = "Multi-agent RHOSP alarm troubleshooting system (AlertManager -> correlation -> PromQL -> node SSH -> RCA report)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tenacity>=8.3",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1.0",
    "langchain-core>=0.3",
    "litellm>=1.40",
    "asyncssh>=2.14",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
tsagent = "tsagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsagent = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
