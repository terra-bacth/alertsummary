# Read-only commands Sanji (Node Agent) may run.
#
# The LLM never hands a string to a shell. It proposes a command, this allow-list validates it,
# and only then is it composed into the director hop. A command that does not fully match one of
# these anchored patterns is refused — there is no "close enough".

# Rejected anywhere in a proposed command, even when a pattern would otherwise match. These are
# the characters that turn one command into two, or redirect it somewhere with side effects.
forbidden_characters: [";", "|", "&", "$", "`", ">", "<", "\\", "\n", "\r"]

# Rejected the same way, but as substrings. Path patterns below permit "/" and "." so that log
# paths work; without this, "/var/log/../../etc/..." would satisfy an otherwise-anchored pattern.
forbidden_sequences: ["..", "~"]

# Commands run on the undercloud/director itself, as the stack user. Anything starting with
# `openstack` or `metalsmith` is automatically prefixed with `source ~/stackrc &&` by the
# executor, so the patterns below stay free of shell operators.
director:
  - pattern: '^cat /etc/rhosp-release$'
    description: RHOSP major version, which decides the command family for node investigation
  # RHOSP 17 removed Nova from the undercloud (provisioning moved to metalsmith with ephemeral
  # Heat), so `openstack server list` fails there with "region not found". metalsmith is the
  # RHOSP 17 source of node hostnames and ctlplane addresses; the Nova form stays for RHOSP 16.
  - pattern: '^metalsmith( (-f|--format) (value|json|table))? list( (-f|--format) (value|json|table))?$'
    description: overcloud nodes and their ctlplane addresses (RHOSP 17)
  - pattern: '^metalsmith show [A-Za-z0-9._-]+( -f (value|json))?$'
    description: detail for one provisioned node (RHOSP 17)
  - pattern: '^openstack server list( -f (value|json|table))?( -c [A-Za-z]+)*$'
    description: overcloud nodes and their ctlplane addresses (RHOSP 16)
  - pattern: '^openstack baremetal node list( -f (value|json|table))?$'
    description: ironic node power/provision state
  - pattern: '^openstack stack list( -f (value|json|table))?$'
    description: heat stack status
  - pattern: '^openstack server show [A-Za-z0-9._-]+( -f (value|json|table))?$'
    description: detail for one overcloud node
  - pattern: '^getent hosts [A-Za-z0-9._-]+(\.[A-Za-z0-9._-]+)*$'
    description: resolve a hostname to an IP via the director's DNS (undercloud dnsmasq)
  - pattern: '^host [A-Za-z0-9._-]+(\.[A-Za-z0-9._-]+)*$'
    description: DNS lookup for a hostname (fallback for envs without getent)

# Commands run on an overcloud node, reached via the director as heat-admin (RHOSP 16) or
# tripleo-admin (RHOSP 16.2+/17). `sudo ` is optional on the read-only systemd and journal
# commands: the model reliably prefixes it, and the output is identical either way.
overcloud:
  # -- host health --
  # The (?!.*\.\.) lookahead makes each path-taking pattern reject traversal on its own, rather
  # than relying solely on the forbidden_sequences filter above.
  - pattern: '^df -h( (?!.*\.\.)[A-Za-z0-9._/-]+)?$'
    description: filesystem usage
  - pattern: '^df -i( (?!.*\.\.)[A-Za-z0-9._/-]+)?$'
    description: inode usage
  - pattern: '^free -m$'
    description: memory usage
  - pattern: '^uptime$'
    description: load average and uptime
  - pattern: '^cat /proc/loadavg$'
    description: raw load average
  - pattern: '^cat /proc/meminfo$'
    description: memory and hugepage details
  - pattern: '^top -bn1$'
    description: one-shot process snapshot
  - pattern: '^ps aux --sort=-%(cpu|mem)$'
    description: processes by cpu or memory
  - pattern: '^iostat -x 1 2$'
    description: disk io
  # -- systemd --
  - pattern: '^(sudo )?systemctl status [A-Za-z0-9@._*-]+$'
    description: unit status
  - pattern: '^(sudo )?systemctl is-active [A-Za-z0-9@._*-]+$'
    description: unit active state
  - pattern: '^(sudo )?systemctl --failed( --no-pager)?$'
    description: failed units
  - pattern: '^(sudo )?systemctl list-units --type=service --state=failed( --no-pager)?$'
    description: failed services
  # -- logs --
  - pattern: '^(sudo )?journalctl -u [A-Za-z0-9@._*-]+ --no-pager -n [0-9]{1,4}$'
    description: recent unit logs
  - pattern: '^(sudo )?journalctl --no-pager -p (err|crit|warning|alert|emerg)(,(err|crit|warning|alert|emerg))* -n [0-9]{1,4}$'
    description: recent high-priority logs (single severity or comma list)
  - pattern: '^(sudo )?journalctl --no-pager --since .+ -n [0-9]{1,4}$'
    description: logs over a recent window
  - pattern: '^sudo tail -n [0-9]{1,4} /var/log/(?!.*\.\.)(containers/)?[A-Za-z0-9._/-]+\.log$'
    description: tail a service log file
  - pattern: '^(sudo )?dmesg -T --level=(err|crit|alert|emerg)(,(err|crit|alert|emerg))*$'
    description: kernel errors
  # -- RHOSP containerised services --
  - pattern: '^sudo podman ps( -a)?$'
    description: running service containers
  - pattern: '^sudo podman ps -a --filter name=[A-Za-z0-9._-]+$'
    description: containers matching a service name
  - pattern: '^sudo podman logs --tail [0-9]{1,4} [A-Za-z0-9._-]+$'
    description: container logs
  - pattern: '^sudo podman inspect [A-Za-z0-9._-]+$'
    description: container detail
  - pattern: '^sudo pcs status$'
    description: pacemaker cluster status on controllers
  - pattern: '^sudo pcs resource status$'
    description: pacemaker resource status
  # A service named *-podman-N is a pacemaker bundle, not a systemd unit — this is how you
  # inspect one, and it is the command the agent needs for cinder-volume, galera, rabbitmq.
  - pattern: '^sudo pcs resource config [A-Za-z0-9._-]+$'
    description: pacemaker bundle/resource definition
  - pattern: '^sudo pcs status resources$'
    description: pacemaker resources only
  - pattern: '^sudo podman ps --filter name=[A-Za-z0-9._-]+$'
    description: containers matching a name
  # -- networking --
  - pattern: '^sudo ovs-vsctl show$'
    description: open vswitch bridges and ports
  - pattern: '^(sudo )?ip -br (addr|link)$'
    description: interface state
  - pattern: '^(sudo )?ip -s link$'
    description: interface errors and drops per device
  - pattern: '^ss -tuln$'
    description: listening sockets
  - pattern: '^ping -c [0-9] [A-Za-z0-9._-]+$'
    description: reachability check
